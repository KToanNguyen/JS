<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>La Pizzarera - Customize Your Pizza</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&family=Lobster&display=swap" rel="stylesheet">
	    <link href="css/normalize.css" rel="stylesheet" />
        <link href="css/pizza.css" rel="stylesheet" />
        <script src="js/order.js" defer></script>
    </head>
    <body>
        <header>
            <h1 class="company">La Pizzarera!</h1>
        </header>
        <fieldset>
        <legend id="custom">Customize your pizza:</legend>
        <form action="confirm.html" method="GET">
                <legend>Size</legend>
                <select id="size" name="size"></select>

                <legend>Crust</legend>
                <select id="crust" name="crust"></select>

                <legend>Cheese</legend>
                <select id="cheese" name="cheese"></select>

                <legend>Meat</legend>
                <select id="meat" name="meat"></select>

                <legend>Vegan</legend>
                <select id="vegan" name="vegan"></select>

                <legend>Number of Pizzas</legend>
                <input type="number" id="number" name="quantity" value="1" min="1" required />

            <button type="submit">Finish!</button>
        </fieldset>
        </form>
    </body>
</html>
